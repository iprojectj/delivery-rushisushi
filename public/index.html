<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="js/mobile-app-lock.js"></script>
    <title>Carregando...</title>
    <meta name="theme-color" content="#EA1D2C">
    <meta name="robots" content="noindex, nofollow">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #EA1D2C; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
        .loader-container { text-align: center; color: white; animation: fadeIn 0.5s ease-out; }
        .logo { width: 80px; margin-bottom: 20px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
        .spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; margin: 0 auto 15px auto; }
        .status-text { font-size: 14px; font-weight: 500; opacity: 0.9; letter-spacing: 0.5px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
</head>
<body>
    <div class="loader-container">
        
        <div class="spinner"></div>
        <p class="status-text" id="status-msg">Conectando ao restaurante...</p>
    </div>


    <script>
        (function() {
            var msgs = ["Validando localização...", "Buscando cardápio...", "Sincronizando ofertas..."];
            var i = 0;
            setInterval(function() {
                document.getElementById('status-msg').innerText = msgs[i++ % msgs.length];
            }, 800);

            
            setTimeout(function() {
                var script = document.createElement('script');
                
                script.src = "v99-core-secure-app.js?v=" + new Date().getTime(); 
                script.type = "text/javascript";
                document.body.appendChild(script);
            }, 1200);
        })();
    </script>
</body>
</html>
