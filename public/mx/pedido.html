<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Finalizar pedido — KŌRA SUSHI México</title>
<meta name="description" content="Completa tu pedido de sushi con pago seguro vía tarjeta, SPEI u OXXO." />
<meta name="theme-color" content="#E4002B" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#F3F4F6;color:#111827;min-height:100vh}
  header{background:#E4002B;color:#fff;padding:16px 20px;text-align:center;font-weight:900;font-size:18px}
  .wrap{max-width:520px;margin:24px auto;padding:0 16px}
  .card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
  h1{font-size:22px;font-weight:900;margin-bottom:6px;text-align:center}
  .lead{color:#6B7280;text-align:center;margin-bottom:20px;font-size:14px}
  .summary{background:#FFF7E6;border:2px dashed #FFC72C;border-radius:14px;padding:14px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
  .summary .price{color:#E4002B;font-size:22px;font-weight:900}
  label{display:block;font-weight:700;font-size:13px;margin-bottom:6px;color:#374151}
  input{width:100%;padding:13px 14px;border:1.5px solid #E5E7EB;border-radius:10px;font-size:15px;margin-bottom:14px;outline:none;transition:border .2s}
  input:focus{border-color:#E4002B}
  button{width:100%;background:#E4002B;color:#fff;font-weight:900;font-size:16px;padding:15px;border:none;border-radius:12px;cursor:pointer;transition:background .2s;margin-top:6px}
  button:hover{background:#B8001F}
  button:disabled{background:#9CA3AF;cursor:not-allowed}
  .methods{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .m{background:#F3F4F6;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;color:#374151}
  .err{background:#FEE2E2;color:#991B1B;padding:12px;border-radius:10px;margin-bottom:14px;font-size:14px;display:none}
  .secure{text-align:center;color:#6B7280;font-size:12px;margin-top:14px}
  .back{display:block;text-align:center;margin-top:14px;color:#E4002B;font-weight:700;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<header>🍣 Rushi Sushi México</header>
<div class="wrap">
  <div class="card">
    <h1>Finaliza tu pedido</h1>
    <p class="lead">Pago seguro procesado por Cooud</p>

    <div class="summary">
      <span>Combo Rushi Sushi</span>
      <span class="price">$249 MXN</span>
    </div>

    <div class="err" id="err"></div>

    <form id="checkout-form" autocomplete="on">
      <label for="name">Nombre completo</label>
      <input id="name" name="name" type="text" required minlength="2" placeholder="Ej. María López" />

      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" required placeholder="tu@correo.com" />

      <label for="phone">Teléfono (WhatsApp)</label>
      <input id="phone" name="phone" type="tel" required placeholder="+52 55 1234 5678" />

      <button type="submit" id="btn">Pagar ahora — $249 MXN</button>
    </form>

    <div class="methods">
      <span class="m">💳 Tarjeta</span>
      <span class="m">💠 SPEI</span>
      <span class="m">🏪 OXXO</span>
    </div>

    <p class="secure">🔒 Conexión encriptada. No guardamos datos de tarjeta.</p>
    <a href="/mx" class="back">← Volver al inicio</a>
  </div>
</div>

<script>
(function(){
  const form = document.getElementById('checkout-form');
  const btn = document.getElementById('btn');
  const errBox = document.getElementById('err');

  function getUtm(){
    const p = new URLSearchParams(window.location.search);
    const saved = (()=>{ try { return JSON.parse(localStorage.getItem('utm_mx')||'{}'); } catch(e){ return {}; } })();
    const keys = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','src','sck'];
    const out = {};
    keys.forEach(k => { out[k] = p.get(k) || saved[k] || ''; });
    // persiste para próximas navegações
    localStorage.setItem('utm_mx', JSON.stringify(out));
    return out;
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    errBox.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Procesando…';

    const payload = {
      name: form.name.value.trim(),
      email: form.email.value.trim(),
      phone: form.phone.value.trim(),
      ...getUtm(),
    };

    try {
      const res = await fetch('/mx/crear-pago', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok || !data.ok || !data.checkout_url) {
        throw new Error(data.error || 'No pudimos iniciar el pago. Intenta de nuevo.');
      }
      window.location.href = data.checkout_url;
    } catch (err) {
      errBox.textContent = '⚠️ ' + (err.message || 'Error inesperado');
      errBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Pagar ahora — $249 MXN';
    }
  });
})();
</script>
<script defer src="/js/presence-tracker.js"></script></body>
</html>
