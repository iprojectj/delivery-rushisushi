<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>¡Gracias por tu pedido! — Rushi Sushi México</title>
<meta name="theme-color" content="#E4002B" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#F3F4F6;color:#111827;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;max-width:480px;width:100%;padding:40px 28px;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.1);text-align:center}
  .icon{width:80px;height:80px;background:#16A34A;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 20px}
  h1{font-size:26px;font-weight:900;margin-bottom:10px}
  p{color:#6B7280;font-size:15px;line-height:1.6;margin-bottom:20px}
  .cta{display:inline-block;background:#E4002B;color:#fff;padding:14px 28px;border-radius:12px;font-weight:800;text-decoration:none;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">✓</div>
  <h1>¡Gracias por tu pedido!</h1>
  <p>Recibimos tu confirmación. En unos minutos te enviaremos los detalles de entrega por WhatsApp y correo.</p>
  <a href="/mx" class="cta">Volver al inicio</a>
</div>
</body>
</html>
