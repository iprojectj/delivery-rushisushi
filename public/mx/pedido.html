<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Finalizar pedido — Rushi Sushi México</title>
<meta name="description" content="Completa tu pedido de sushi con pago seguro vía SPEI, OXXO o tarjeta." />
<meta name="theme-color" content="#E4002B" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#F3F4F6;color:#111827;min-height:100vh}
  header{background:#E4002B;color:#fff;padding:16px 20px;text-align:center;font-weight:900;font-size:18px}
  .wrap{max-width:520px;margin:24px auto;padding:0 16px}
  .card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
  h1{font-size:22px;font-weight:900;margin-bottom:8px;text-align:center}
  .lead{color:#6B7280;text-align:center;margin-bottom:24px;font-size:15px}
  .soon{background:linear-gradient(135deg,#FFC72C,#F59E0B);color:#111;padding:20px;border-radius:14px;text-align:center;font-weight:800;margin-bottom:20px}
  .soon big{display:block;font-size:32px;margin-bottom:6px}
  ul{list-style:none;padding:0;margin:20px 0}
  li{padding:12px 0;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;gap:12px;font-size:15px}
  li:last-child{border:none}
  .ico{font-size:22px}
  .back{display:block;text-align:center;margin-top:20px;color:#E4002B;font-weight:700;text-decoration:none}
  .back:hover{text-decoration:underline}
</style>
</head>
<body>
<header>🍣 Rushi Sushi México</header>
<div class="wrap">
  <div class="card">
    <h1>¡Ya casi lo tenemos listo!</h1>
    <p class="lead">Estamos activando los métodos de pago para México.</p>

    <div class="soon">
      <big>🚧</big>
      Checkout próximamente
    </div>

    <ul>
      <li><span class="ico">💠</span> Pago instantáneo con SPEI</li>
      <li><span class="ico">🏪</span> Pago en efectivo con OXXO Pay</li>
      <li><span class="ico">💳</span> Tarjeta de crédito y débito</li>
      <li><span class="ico">🚚</span> Entrega en CDMX, MTY y GDL</li>
    </ul>

    <a href="/mx" class="back">← Volver al inicio</a>
  </div>
</div>
</body>
</html>
